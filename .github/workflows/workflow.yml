name: Build and Deploy BloatBuster

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bloatbuster:latest

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Pull and restart Container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bloatbuster:latest
          
          docker stop bloatbuster || true
          docker rm bloatbuster || true
          
          docker run -d \
            --name bloatbuster \
            --restart unless-stopped \
            -p 3000:3000 \
            -e SHOPIFY_API_KEY="468869026551455874d932a9608b7494" \
            -e SHOPIFY_API_SECRET="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" \
            -e SCOPES="read_themes,write_themes" \
            -e HOST="https://bloatbuster.relayworks.com" \
            -e PORT="3000" \
            ${{ secrets.DOCKERHUB_USERNAME }}/bloatbuster:latest

          sleep 5
          docker ps | grep bloatbuster
