services:
  bloatbuster:
    build: .
    container_name: bloatbuster-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY:-}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET:-}
      - SCOPES=read_themes,write_themes
      - HOST=${HOST:-https://bloatbuster.relayworks.dev}
